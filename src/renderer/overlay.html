<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #card { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: rgba(20, 23, 28, 0.94); color: #f0f4f8; border: 1px solid #ffffff18; border-radius: 16px; padding: 14px 16px; box-shadow: 0 8px 24px #0005; }
  #header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  #brand { font-size: 13px; font-weight: 650; }
  #mode { background: #8ab4ff20; color: #a9c9ff; border: 1px solid #8ab4ff40; border-radius: 6px; padding: 3px 7px; font-size: 11px; }
  #card[data-mode=insert] #mode { background: #c4a7ff20; color: #d4beff; border-color: #c4a7ff40; }
  #card[data-mode=workflow] #mode { background: #a7f3d020; color: #a7f3d0; border-color: #a7f3d040; }
  #state { font-size: 11px; color: #a8b2bf; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  #activation { margin-left: auto; color: #a8b2bf; font-size: 10px; }
  #transcript { font-size: 14px; line-height: 1.4; min-height: 20px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #action { font-size: 12px; color: #a7f3d0; margin-top: 7px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
  #status { font-size: 12px; color: #c4ccd8; line-height: 1.35; margin-top: 4px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #card[data-state=error] #status { color: #ffadb6; }
  #hint { color: #a8b2bf; font-size: 11px; line-height: 1.4; margin-top: 10px; }
  #footer { border-top: 1px solid #ffffff10; margin-top: 10px; padding-top: 8px; display: flex; gap: 8px; align-items: center; }
  #shortcuts { color: #a8b2bf; font-size: 10px; flex: 1; }
  #latency { font-size: 10px; color: #a8b2bf; white-space: nowrap; }
  #choices { list-style: none; padding: 0; margin: 8px 0 0; }
  #choices li { display: flex; gap: 8px; align-items: center; font-size: 12px; padding: 4px 0; }
  #choices .number { flex: 0 0 19px; height: 19px; line-height: 19px; text-align: center; color: #06251b; background: #a7f3d0; border-radius: 5px; font-weight: 700; }
  #choices .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #card.choosing #action, #card.choosing #status, #card.choosing #latency { display: none; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #697386; }
  .dot.listening { background: #8ab4ff; }
  .dot.thinking, .dot.executing { animation: dragon-pulse 0.9s ease-in-out infinite; }
  .dot.thinking { background: #ffd166; }
  .dot.executing, .dot.done { background: #a7f3d0; }
  .dot.error { background: #ff8796; }
  @keyframes dragon-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>
  <div id="card" data-mode="normal" data-state="idle">
    <div id="header"><span id="brand">Dragon</span><span id="mode">Command</span></div>
    <div id="state"><span class="dot idle" id="dot"></span><span id="stateText">Mic off</span><span id="activation">Listen toggle</span></div>
    <div id="transcript">Ready when you are.</div>
    <div id="action"></div>
    <div id="status" role="status"></div>
    <ol id="choices"></ol>
    <div id="hint">Say “open Chrome” or “point to Save”.</div>
    <div id="footer"><span id="shortcuts"></span><span id="latency"></span></div>
  </div>
  <script src="../../dist-renderer/overlay.js"></script>
</body>
</html>
