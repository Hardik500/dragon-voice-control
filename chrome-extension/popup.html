<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; width: 330px; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1c2927; background: #f6f8f5; }
  h1 { font-size: 18px; line-height: 1.3; margin: 0 0 14px; }
  h2 { font-size: 12px; margin: 0 0 5px; font-weight: 600; }
  p { margin: 5px 0 0; color: #56615c; }
  .card { padding: 13px; margin: 10px 0; background: #fff; border: 1px solid #dce4dc; border-radius: 10px; }
  .status { display: flex; align-items: center; gap: 7px; font-weight: 600; }
  .dot { width: 8px; height: 8px; flex-shrink: 0; border-radius: 50%; background: #bd7b2d; }
  .ready .dot { background: #19855b; }
  #page-title { white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
  button { border: 0; border-radius: 7px; padding: 9px 12px; font: inherit; font-weight: 600; cursor: pointer; background: #203e35; color: white; }
  button:focus-visible { outline: 3px solid #8ebfa3; outline-offset: 2px; }
  button:disabled { opacity: 0.6; cursor: wait; }
  .examples { font-size: 12px; }
</style>
</head>
<body>
  <h1>Dragon Browser Control</h1>
  <div class="card" role="status" aria-live="polite">
    <div class="status" id="connection"><span class="dot" aria-hidden="true"></span><span id="connection-text">Checking connection…</span></div>
    <p id="connection-help">Keep the Dragon desktop app open.</p>
  </div>
  <div class="card">
    <h2 id="page-title">Current Chrome page</h2>
    <p id="page-status">Checking page controls…</p>
  </div>
  <button id="reconnect" type="button">Check connection</button>
  <p class="examples">Try “click Save”, “scroll down”, “next tab”, or “switch to tab 3”.</p>
  <p class="examples">For app controls and permissions, open Dragon Settings from its tray menu.</p>
  <script src="popup.js"></script>
</body>
</html>
