appId: com.dragon.alpha
productName: Dragon
directories:
  output: release
# Deterministic, space-free artifact names: Dragon-<version>-<arch>.exe / .app.
# electron-builder's default is "Dragon 0.1.0.exe", and a space in a filename you
# are about to share and have people type is not worth carrying.
artifactName: Dragon-${version}-${arch}
files:
  - dist/**/*
  - dist-renderer/**/*
  - src/renderer/**/*.html
  - assets/**/*
  - package.json
extraResources: []
mac:
  target:
    # A .dmg is the macOS distribution ritual: open the image, drag Dragon into
    # Applications. There is no "setup program" on macOS and there does not need to be one.
    - target: dmg
      arch:
        - arm64
  category: public.app-category.productivity
  icon: assets/app-icon-512.png
  # Personal, unsigned local alpha build (see DECISIONS.md): no code signing
  # or notarization. macOS Gatekeeper will require an explicit
  # right-click/Open the first time this is launched.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSMicrophoneUsageDescription: "Dragon needs the microphone to listen for voice commands."
win:
  target:
    # A real installer rather than a portable file: Dragon is a tray app launched many times a
    # day, so a Start Menu entry and an Add/Remove Programs entry are worth having. oneClick
    # with perMachine:false installs into the user profile and never asks for admin -- the right
    # trade for an unsigned binary, since a UAC prompt stacked on the SmartScreen warning is two
    # trust asks before anything runs.
    - target: nsis
      arch:
        - x64
  artifactName: Dragon-${version}-${arch}-Setup.exe
  icon: assets/app-icon.ico
  # Personal, unsigned local alpha build: no code signing. Deliberately NOT setting
  # `signAndEditExecutable: false` here -- that flag does not just skip signing, it also
  # skips rcedit, which is what appends the .exe extension and stamps the icon/metadata.
  # Turning it off produced "Dragon-0.1.0-x64", a valid PE that Windows will not launch on
  # double-click, carrying Electron's default icon. Being unsigned needs no flag at all:
  # electron-builder skips signing on its own when it finds no certificate (it logs
  # "no signing info identified, signing is skipped"). See scripts/build-release.js.
# Installer options live at the TOP LEVEL, not under `win:`. electron-builder validates the
# config against a strict schema and rejects `win.nsis` outright with "configuration.win has an
# unknown property 'nsis'". Only genuinely Windows-shaped keys (icon, artifactName, target) go
# under `win:`.
nsis:
  oneClick: true
  # Per-user install: no UAC prompt. An unsigned installer already draws a SmartScreen warning,
  # and asking for admin on top of that is two trust asks before anything runs.
  perMachine: false
  allowToChangeInstallationDirectory: false
  createStartMenuShortcut: true
  createDesktopShortcut: true
